<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change — coded motion study</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111110;color:#eeede9;font:13px system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}main{width:min(1080px,94vw);padding:30px 0}header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}h1{font-size:15px;letter-spacing:-.3px;font-weight:550;margin:0}header span{color:#77766f;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.stage{width:min(100%,calc(78vh * 4 / 3));aspect-ratio:4/3;position:relative;max-height:78vh;background:#ddd;overflow:hidden;margin:auto}canvas{display:block;width:100%;height:100%;object-fit:contain}footer{margin-top:20px;display:flex;align-items:center;gap:17px}button,select{font:inherit;color:inherit;background:transparent;border:1px solid #41413b;border-radius:5px;padding:7px 12px;cursor:pointer}button:hover,select:hover{border-color:#8d8d80}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #e6eea1;outline-offset:4px}button.primary{min-width:76px;background:#eeede9;color:#111;border-color:#eeede9}input[type=range]{accent-color:#dfe497;flex:1;min-width:70px}time{font-variant-numeric:tabular-nums;font-size:11px;color:#a4a399;min-width:81px}select{max-width:135px;background:#111110}#status{font-size:11px;color:#76766e;line-height:1.5;margin:16px 0 0}#loading{position:absolute;inset:0;display:grid;place-content:center;background:#181817;color:#aaa}body.clean{background:transparent;display:block}body.clean main{width:100vw;padding:0}body.clean header,body.clean footer,body.clean #status{display:none}.stage:fullscreen{width:100vw;height:100vh;background:#111;aspect-ratio:auto;max-height:none}body.clean .stage{max-height:none;width:100vw;height:100vh;aspect-ratio:auto}@media(max-width:600px){footer{gap:9px;flex-wrap:wrap}time{min-width:auto}header span{display:none}select{font-size:11px}main{width:96vw}header,#status{margin-left:8px}button{padding:6px 9px}.stage{max-height:none}}
